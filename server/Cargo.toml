[package]
name = "dispatch-server"
version = "0.1.0"
description = "Self-hostable backend for the Dispatch desktop app: one shared Postman API key served through role-based access control."
edition = "2021"

# Standalone backend crate, deliberately outside the Tauri app's workspace.
[workspace]

[dependencies]
axum = "0.8"
tower-http = { version = "0.6", features = ["cors"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
argon2 = "0.5"
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
include_dir = "0.7"